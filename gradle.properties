org.gradle.jvmargs=-Xmx2048m
# Google Play Billing and Play Age Signals are AndroidX-era libraries, so this has to be on now.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Signing. On Google Play this key is only the *upload* key: Play App Signing re-signs the app
# with Google's own key before it reaches anyone. Keep this repository private all the same.
FD_STORE_FILE=finndash-key.jks
FD_STORE_PASSWORD=finndash
FD_KEY_ALIAS=finndash
FD_KEY_PASSWORD=finndash
