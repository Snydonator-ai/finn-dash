name: Build Finn Dash

# Runs whenever you push a change, and can also be started by hand from the Actions tab.
# Makes two files:
#   finn-dash.apk  - install straight onto the family tablets, as before
#   finn-dash.aab  - the "app bundle" you upload to the Google Play Console
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # needed so the finished app can be attached to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build the app and the Play bundle
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name them finn-dash.apk and finn-dash.aab
        run: |
          cp app/build/outputs/apk/release/app-release.apk finn-dash.apk
          cp app/build/outputs/bundle/release/app-release.aab finn-dash.aab

      - name: Publish them as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest finn-dash.apk finn-dash.aab \
            --title "Finn Dash - latest build" \
            --notes "Tap **finn-dash.apk** on a tablet to install it. Upload **finn-dash.aab** to the Google Play Console."

