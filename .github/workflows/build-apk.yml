name: Build Finn Dash APK

# Runs whenever you push a change, and can also be started by hand from the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # needed so the finished app can be attached to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name it finn-dash.apk
        run: cp app/build/outputs/apk/release/app-release.apk finn-dash.apk

      - name: Publish it as the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest finn-dash.apk \
            --title "Finn Dash - latest build" \
            --notes "Tap **finn-dash.apk** below on the Fire tablet to install the newest version."
