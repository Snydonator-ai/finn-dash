name: Build Finn Dash APK

# Runs whenever you push a change, and can also be started by hand from the Actions tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write        # needed so the finished app can be attached to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name it finn-dash.apk
        run: cp app/build/outputs/apk/release/app-release.apk finn-dash.apk

      - name: Keep a copy in this run
        uses: actions/upload-artifact@v4
        with:
          name: finn-dash-apk
          path: finn-dash.apk

      - name: Publish it as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Finn Dash - latest build
          body: |
            Tap **finn-dash.apk** below on the Fire tablet to install the newest version.
          files: finn-dash.apk
